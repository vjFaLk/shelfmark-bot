services:
  shelfmark-bot:
    image: ghcr.io/vjfalk/shelfmark-bot:latest
    container_name: shelfmark-bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ""
      SHELFMARK_URL: ""
      ALLOWED_USER_IDS: ""   # optional, comma-separated
      LOG_LEVEL: "INFO"      # optional
